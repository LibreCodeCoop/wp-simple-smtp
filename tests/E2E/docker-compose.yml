name: simple-smtp-e2e

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_SMTP_AUTH: "mailer:pa'ss"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8026:8025"

  wordpress:
    image: wordpress:7.1-php8.3-apache
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "8889:80"
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 1s
      retries: 60
    volumes:
      - wordpress:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/wp-simple-smtp:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes_from:
      - wordpress
    volumes:
      - ./support/setup.sh:/setup.sh:ro
    command: ["sh", "/setup.sh"]

volumes:
  wordpress:
